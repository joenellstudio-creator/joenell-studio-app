# Builds Joenell Studio Lite (the browser version of Joe Light Studio, apps/lightcraft-web) and
# publishes the static site to the `lite-site` branch, which Cloudflare Pages deploys to
# https://lite.joenellstudio.com/. The same site is also attached to the "web-latest" release as a zip.
name: Web build (Joenell Studio Lite)

on:
  push:
    branches: [main]
    paths:
      - "apps/lightcraft-web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "xtask/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the wasm-bindgen CLI (version pinned in Cargo.lock)
        run: |
          v="$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          test -n "$v"
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: Install binaryen (wasm-opt, smaller download)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build the browser app
        run: cargo xtask web
      - name: Assemble the site
        run: |
          target_dir="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          mkdir -p _site
          cp -R "$target_dir/web-site/." _site/
          cp LICENSE-MIT LICENSE-APACHE NOTICE _site/
          cp packaging/web/_headers _site/
          # Cloudflare Pages serves files up to 25 MiB and compresses responses itself: ship the module
          # gzipped as .wasmz (index.html unpacks it) and drop the precompressed copies.
          gzip -9 -n -c _site/lightcraft_web_bg.wasm > _site/lightcraft_web_bg.wasmz
          rm -f _site/lightcraft_web_bg.wasm _site/*.br _site/*.gz
          printf '\n/*.wasmz\n  Content-Type: application/octet-stream\n' >> _site/_headers
          ls -la _site
          (cd _site && zip -qr9 ../joenell-studio-lite.zip .)
          ls -lh joenell-studio-lite.zip
      - uses: actions/upload-artifact@v4
        with:
          name: joenell-studio-lite
          path: joenell-studio-lite.zip
      - name: Publish to the "web-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view web-latest >/dev/null 2>&1 || gh release create web-latest --title "Joenell Studio Lite (latest web build)" --notes "Static site for https://lite.joenellstudio.com/ built from main. Upload the zip's contents to Cloudflare Pages."
          gh release upload web-latest joenell-studio-lite.zip --clobber
      - name: Publish the site to the lite-site branch (Cloudflare Pages deploys it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b lite-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Joenell Studio Lite build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" lite-site
